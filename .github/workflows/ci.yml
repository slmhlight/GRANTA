name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # R91 — version 명시 제거. pnpm/action-setup 은 package.json 의 `packageManager` 필드 (pnpm@10.4.1) 를 자동으로 읽음.
      #       둘 다 명시하면 errors out (deploy-pages.yml 코멘트 참조).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate materials.json (data pipeline)
        # client/public/materials.json 는 R91 부터 .gitignore 처리 — CI 에서 매 run 직접 생성.
        run: pnpm build:data
      - name: Generate wiki index (R227/E14 — build:data 선행 필요)
        # client/public/wiki-*.json 은 build:wiki 산출물(.gitignore). 게이트 tests/wiki-index.test.ts 가 읽음.
        run: pnpm build:wiki
      - name: Generate property stats (H6 A-3 — QueryBar 필터 힌트, build:data 선행 필요)
        # client/public/property-stats.json 은 R167 산출물 — 과거 커밋본이 5주 stale 로 서빙되던 실사고.
        run: pnpm build:stats
      - name: Type check (tsc --noEmit)
        run: pnpm check
      - name: "Lint (eslint — 정책 룰: react-hooks·TDZ·dark: 금지 · 경고 0)"
        # R210 에서 경고를 비차단으로 두고 단계 도입했고, H6 F3(2026-09-11)에서 잔여 9건을 소진해
        # --max-warnings 0 으로 조인다. exhaustive-deps 경고가 새로 생기면 여기서 막힌다 —
        # 의존성 누락은 "가끔 안 갱신되는 화면" 으로 나타나 테스트로는 잘 안 잡히는 부류다.
        run: pnpm lint
      - name: Run unit tests + coverage (vitest)
        # R210 — test:cov: lib/hooks 커버리지 임계(보수적) 하향 회귀 차단. 데이터 불변식 테스트는
        #         위 build:data 산출물(materials.json·build-meta.json)을 읽으므로 순서 의존 OK.
        run: pnpm test:cov
      - name: Build production bundle
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────────────
  # F4 — E2E 스모크 1 flow. **별도 job** 이다: 스모크가 흔들려도 위 단위 게이트
  # 1,215 건의 결과를 가리지 않는다.
  #
  # 맡는 범위가 다르다 — 값의 정확성은 단위·게이트가 보고, 여기서는 "배포 산출물이 실제로
  # 서빙되어 앱이 부팅하는가" 만 본다. 이 프로젝트의 실사고(배포에서 build:wiki 누락 →
  # wiki-index.json 404 → 자동링크 전멸)가 정확히 그 부류였고, 기존 게이트는 워크플로
  # **텍스트**만 검사해 잡지 못하는 자리였다.
  #
  # flake 예산(백로그 F4 도입 조건): 재시도 0 · 외부 네트워크 차단 · 고정 sleep 금지.
  # 코드 원인이 아닌 실패가 최근 20 회 중 2 회를 넘으면 즉시 continue-on-error 로 격리하고
  # 원인을 고치거나 폐기한다 — 방치하지 않는다.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      # 배포(deploy-pages.yml)와 **같은 base** 로 빌드해야 경로 어긋남도 검사 범위에 들어온다.
      VITE_BASE: /GRANTA/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate materials.json (data pipeline)
        run: pnpm build:data
      - name: Generate wiki index (build:data 선행 필요)
        run: pnpm build:wiki
      - name: Generate property stats
        run: pnpm build:stats
      - name: Build static site (deploy 와 동일 base)
        run: pnpm exec vite build
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        run: pnpm test:e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
